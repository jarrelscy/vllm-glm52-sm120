# Experimental attention-output quantization; merge after compose.yaml.
services:
  glm53-arvq:
    environment:
      PARALLEL: ${PARALLEL:-tp4-1m}
      VLLM_ENABLE_NVFP4_P4_O_PROJ: '1'
      VLLM_NVFP4_P4_MAX_TOKENS: '8'
      MAX_NUM_SEQS: '4'
    command:
    - --trust-remote-code
    - --reasoning-parser
    - glm47
    - --profiler-config.profiler=torch
    - --profiler-config.torch_profiler_dir=/profiles
    - --profiler-config.torch_profiler_with_stack=false
    - ${PREFIX_CACHING_FLAG:---enable-prefix-caching}
    - --compilation-config
    - '{"mode":3,"cudagraph_mode":"${CUDAGRAPH_MODE:-FULL_AND_PIECEWISE}","compile_sizes":[1],"cudagraph_capture_sizes":[1,2,4,8,16]}'
