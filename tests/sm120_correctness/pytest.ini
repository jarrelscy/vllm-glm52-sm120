# Self-contained pytest config for the SM120 correctness suite.
# Only used when pytest is invoked from inside tests/sm120_correctness/
# (rootdir discovery); never affects the repo's top-level pytest config.
[pytest]
addopts = -ra --strict-markers
markers =
    sm120_correctness: opt-in GLM-5.2 SM120 correctness/regression suite
    sm120_tier(name): tier of the SM120 suite (cpu, kernel, dist, server, canary)
